[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "coding-agent"
version = "0.1.0"
description = "A small, self-contained coding agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40,<1",
    "platformdirs>=4,<5",
    "pydantic>=2.9,<3",
    "rich>=13,<15",
    "textual>=1,<2",
    "typer>=0.12,<1",
]

[project.scripts]
coding-agent = "coding_agent.cli:main"

[dependency-groups]
dev = [
    "pyright>=1.1.390",
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "pytest-cov>=6,<8",
    "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/coding_agent"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["coding_agent"]
omit = ["src/coding_agent/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".git", ".tmp", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
