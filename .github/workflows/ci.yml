name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.6"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --all-groups
      - run: uv run ruff format --check src tests scripts
      - run: uv run ruff check src tests scripts
      - run: uv run pyright
      - name: Run pytest
        shell: bash
        run: |
          set -o pipefail
          uv run pytest --cov=coding_agent --cov-branch --cov-report=term-missing --cov-report=json:coverage.json --cov-report=xml:coverage.xml --junitxml=pytest-results.xml 2>&1 | tee pytest-output.txt
      - name: Report pytest failures
        if: failure()
        run: uv run python scripts/report_pytest_failures.py pytest-results.xml --log pytest-output.txt
      - run: uv run python scripts/check_coverage.py coverage.json
      - run: uv run python scripts/check_secrets.py src tests scripts docs examples .github config.example.toml pyproject.toml README.md
      - run: uv run coding-agent --help
